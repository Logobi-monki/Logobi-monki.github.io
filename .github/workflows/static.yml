# Publish the original public learner website only.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site (exclude private MYP integration files)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='LocalMCP.mcp/' \
            --exclude='academic-copilot.html' \
            --exclude='academic-copilot.css' \
            --exclude='academic-copilot.js' \
            --exclude='home.css' \
            --exclude='index-fr.html' \
            --exclude='oauth/consent/*.zip' \
            ./ _site/
      - name: Upload public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
